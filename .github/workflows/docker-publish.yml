name: Build and publish Docker image

on:
  push:
    branches: [dev]
    paths:
      - app.py
      - requirements.txt
      - Dockerfile
      - .dockerignore

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - id: build
        name: Build and Pusblish Image
        uses: Alexandergv2117/actions/docker-build-push@dev
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          push: true
